.trip-cover,.trip-summary,.budget-card,.money-card,.mobile-budget-row{overflow-wrap:anywhere}
.brand,.header-right,.title-row,.save-group,.section-heading,.day-heading,.cover-content,.cover-meta,.money-card,.trip-summary,.event-card,.event-info{min-width:0}
.cover-content h2,.studio-heading h2,.trip-summary h3{overflow-wrap:anywhere;hyphens:auto}
.event-info h4,.event-info p,.saved-list strong,.money-card strong,.money-card small{overflow-wrap:anywhere;word-break:break-word}
.budget-card .budget-number{font-size:clamp(1.25rem,3vw,1.8rem);overflow-wrap:anywhere;line-height:1.3}
.budget-remaining{gap:12px;flex-wrap:wrap}.budget-remaining strong{overflow-wrap:anywhere}
.rate-input input,.budget-edit input,.exchange-form input,.trip-dialog input,.trip-dialog textarea{min-width:0}
.budget-sheet td input,.budget-sheet td select{min-width:0}
@media (min-width: 1100px){main{max-width:1320px;padding-inline:48px}.workspace{grid-template-columns:minmax(0,1fr) 310px;gap:48px}.finance-bottom{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
@media (min-width: 821px) and (max-width:1099px){main{padding-inline:32px}.workspace{grid-template-columns:minmax(0,1fr) minmax(240px,280px);gap:26px}.finance-bottom{grid-template-columns:repeat(2,minmax(0,1fr))}.exchange-form{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width: 820px){
  .topbar{padding-inline:20px}.workspace{grid-template-columns:minmax(0,1fr);gap:22px}
  .planner, .workspace aside{width:100%}.trip-summary{display:none}.local-tip{padding-top:8px}
  .finance-bottom{grid-template-columns:minmax(0,1fr)}
  .sheet-scroll{display:none}.budget-mobile-cards{display:grid;gap:12px;padding:0 14px 16px}
  .mobile-budget-row{border:1px solid #e2eaf5;border-radius:14px;padding:16px;background:#fff;box-shadow:0 3px 12px #263d6208;display:grid;gap:13px;min-width:0}
  .mobile-row-head,.mobile-row-total{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
  .mobile-row-index{font-size:12px;color:#6182b8;background:#edf3fd;padding:5px 8px;border-radius:6px;flex:none}
  .mobile-row-amount{font-size:17px;color:#2459ef;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
  .mobile-budget-row label{display:flex;flex-direction:column;gap:6px;color:#70819a;font-size:12px;min-width:0}
  .mobile-budget-row input,.mobile-budget-row select{display:block;width:100%;min-width:0;max-width:100%;height:43px;padding:8px 10px;border:1px solid #dce5f1;background:#fafcff;border-radius:8px;color:#293e59;font-size:16px;box-sizing:border-box;text-align:left}
  .mobile-budget-row input:focus-visible,.mobile-budget-row select:focus-visible{outline:2px solid #8aa9ff;outline-offset:0;background:white}
  .mobile-title input{font-weight:650}.mobile-field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0}
  .mobile-budget-row input[type=date]{padding-inline:6px;font-size:14px}
  .mobile-budget-row input[type=number]{font-variant-numeric:tabular-nums}
  .mobile-row-total{background:#f4f7fc;padding:11px 12px;border-radius:8px;font-size:13px;color:#687f9f}
  .mobile-row-total strong{font-size:16px;color:#244b89;overflow-wrap:anywhere;text-align:right;font-variant-numeric:tabular-nums}
  .mobile-paid{background:#edf7f4}.mobile-paid strong{color:#287d76}
  .mobile-note input{height:39px;font-size:14px}
  .mobile-row-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1px}
  .mobile-row-actions button{border:1px solid #dce6f3;background:#fff;border-radius:8px;color:#6681a8;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
  .sheet-foot{border-top:1px solid #eaf0f6}
  .money-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rate-toolbar{align-items:stretch}.rate-input{flex:1 1 auto}.rate-toolbar>.outline{flex:0 0 auto}
}
@media(max-width:550px){
  .topbar{height:64px;padding-inline:16px;gap:9px}
  .brand{font-size:22px}.logo{width:30px;height:30px;margin-right:6px}
  .header-right{gap:4px}.header-right .primary{padding:9px 10px;min-height:40px}.header-right .quiet{padding:7px;font-size:13px}
  .header-right .create-label{display:none}
  main{padding:18px 16px 0}.breadcrumb{margin-bottom:18px}
  .title-row{display:block;margin-bottom:20px}.title-row h1{font-size:clamp(22px,6vw,28px);max-width:100%;margin-bottom:5px}.title-row p{font-size:14px;max-width:none}
  .save-group{justify-content:space-between;margin-top:14px;gap:10px}.save-state{display:inline;line-height:1.4;flex:1;font-size:12px}.save-group .outline{margin-top:0;min-height:40px;flex:none}
  .trip-cover{padding:22px 18px;min-height:208px;align-items:flex-end}.cover-content{max-width:100%}.cover-content h2{font-size:clamp(21px,6vw,27px);line-height:1.2;margin-bottom:9px}.cover-meta{font-size:12px;line-height:1.4}.cover-edit{padding:7px 9px}
  .main-tabs{gap:20px!important}.main-tabs button{font-size:14px}
  .workspace{padding-top:18px}.days button{flex-basis:113px}.day-heading{align-items:flex-start}.day-heading h3{font-size:15px}.day-heading .text-button{padding-top:0;min-width:66px}
  .event{grid-template-columns:51px minmax(0,1fr)}.event:before{left:44px}.event-time{font-size:11px}.timeline-dot{right:-2px}.event-card{padding:12px 10px;gap:8px}.category-icon{width:30px;height:30px}.event-info h4{font-size:14px;line-height:1.45}.event-info p{font-size:12px;line-height:1.5}.event .icon-button{flex:none}.add-event{margin-left:59px;width:calc(100% - 59px);padding:15px 8px}
  .budget-card{padding:19px}.budget-card .budget-number{font-size:27px}
  .studio-heading{display:block}.studio-heading h2{max-width:none;font-size:21px}.studio-heading p{max-width:none;font-size:13px}.studio-badge{margin-top:13px;width:max-content}
  .rate-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:11px;padding:14px}
  .rate-label{grid-column:1/-1}.rate-label>div{min-width:0}.rate-label small{line-height:1.5;overflow-wrap:anywhere;font-size:12px}
  .rate-input{white-space:normal;min-width:0}.rate-input input{width:clamp(72px,22vw,98px);padding:8px 5px;font-size:16px}
  .rate-toolbar .outline{margin:0;min-height:41px;padding:8px;font-size:12px;white-space:normal;line-height:1.3}
  .money-grid{gap:9px}.money-card{padding:14px 12px}.money-card>strong{font-size:clamp(19px,5vw,24px);line-height:1.25}.money-card>small{line-height:1.5}.budget-edit{font-size:20px}.budget-edit input{font-size:20px}
  .sheet-toolbar{gap:12px}.sheet-toolbar h3{font-size:17px}.sheet-actions{margin-left:0;width:100%;display:grid;grid-template-columns:1fr 1fr}.sheet-actions button{min-width:0;min-height:40px;font-size:13px}
  .sheet-filter{display:grid;grid-template-columns:minmax(0,1fr) 102px;gap:8px}.sheet-filter label{min-width:0}.sheet-filter select{min-width:0;max-width:100%}.sheet-filter>span{grid-column:1/-1;margin-left:0}
  .budget-mobile-cards{padding-inline:12px}.mobile-budget-row{padding:14px}
  .wallet-summary strong{font-size:clamp(20px,6vw,26px);overflow-wrap:anywhere}.exchange-form{gap:10px}.exchange-form input{padding:9px 7px;font-size:14px}
  .exchange-panel,.breakdown-panel{padding:17px}.exchange-list>div{min-width:0;flex-wrap:wrap}
  .backup-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.backup-tools>div{grid-column:1/-1}.backup-tools .outline{min-width:0;white-space:normal;padding:10px;font-size:12px;text-align:center}
  .trip-dialog{width:calc(100vw - 24px);max-width:none;padding:20px!important}.trip-dialog .form-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
}
@media(max-width:350px){main{padding-inline:12px}.topbar{padding-inline:12px}.mobile-field-grid{grid-template-columns:minmax(0,1fr)}.actual-fields{grid-template-columns:minmax(0,1fr)}.rate-toolbar{grid-template-columns:minmax(0,1fr)}.rate-label{grid-column:auto}.rate-toolbar .outline{width:100%}.money-grid{grid-template-columns:minmax(0,1fr)}.backup-tools{grid-template-columns:1fr}.budget-studio .studio-heading h2{font-size:19px}}

/* Mobile dialog and interaction refinements */
.trip-dialog[data-slot="dialog-content"]{position:fixed!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;width:min(520px,calc(100vw - 28px))!important;max-width:calc(100vw - 28px)!important;max-height:min(88dvh,760px);box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;padding:56px clamp(18px,5vw,28px) 24px!important;scrollbar-gutter:stable;}
.trip-dialog [data-slot="dialog-close"]{position:absolute!important;top:12px!important;right:12px!important;left:auto!important;bottom:auto!important;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:12px;color:#46546a;background:#f2f5fa;z-index:2;cursor:pointer;transition:background .18s ease,transform .18s ease,opacity .18s ease;}
.trip-dialog [data-slot="dialog-close"]:hover{background:#e4eafb;transform:scale(1.06)}
.trip-dialog [data-slot="dialog-title"]{line-height:1.35;overflow-wrap:anywhere;padding-right:0}
.trip-dialog form,.trip-dialog label,.trip-dialog .form-grid>*{min-width:0}
.activity-cost-input{display:grid;grid-template-columns:minmax(0,1fr) minmax(100px,132px);gap:9px;min-width:0}
.trip-dialog .activity-cost-input input,.trip-dialog .activity-cost-input select{min-width:0;width:100%;box-sizing:border-box}
.rate-hint{font-size:12px;color:#77869c;line-height:1.5}
[data-slot="dialog-overlay"]{background:rgba(21,39,68,.47);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
[data-slot="dialog-overlay"][data-state="open"]{animation:trip-fade-in .23s ease-out both}
[data-slot="dialog-overlay"][data-state="closed"]{animation:trip-fade-out .17s ease-in both}
.trip-dialog[data-state="open"]{animation:trip-dialog-in .28s cubic-bezier(.2,.85,.25,1) both}
.trip-dialog[data-state="closed"]{animation:trip-dialog-out .17s ease-in both}
@keyframes trip-fade-in{from{opacity:0}to{opacity:1}}
@keyframes trip-fade-out{from{opacity:1}to{opacity:0}}
@keyframes trip-dialog-in{from{opacity:0;translate:0 12px;scale:.975}to{opacity:1;translate:0 0;scale:1}}
@keyframes trip-dialog-out{from{opacity:1;translate:0 0;scale:1}to{opacity:0;translate:0 7px;scale:.985}}
button,.outline,[role="tab"],.saved-list>button,.icon-button{touch-action:manipulation;transition:transform .18s ease,background-color .2s ease,box-shadow .2s ease,color .2s ease,opacity .2s ease}
button:active,.outline:active,[role="tab"]:active{transform:scale(.975)}
button:focus-visible,.outline:focus-visible{outline:3px solid #94b2ff;outline-offset:2px}
@media(max-width:700px){.trip-dialog[data-slot="dialog-content"]{width:calc(100vw - 24px)!important;max-width:calc(100vw - 24px)!important;max-height:calc(100dvh - 32px);padding:52px 18px 22px!important;border-radius:20px!important}.trip-dialog .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.trip-dialog input,.trip-dialog textarea,.trip-dialog select{font-size:16px!important}}
@media(max-width:380px){.trip-dialog .form-grid{gap:9px}.activity-cost-input{grid-template-columns:minmax(0,1fr) 104px}}
@media(prefers-reduced-motion:reduce){.trip-dialog,[data-slot="dialog-overlay"],button,.outline,[role="tab"]{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.trip-dialog select[aria-label="일정 분류"]{appearance:auto;-webkit-appearance:menulist;color:#17243b;background:#fff;border:1px solid #dce2eb;border-radius:8px;width:100%;min-height:43px;padding:10px 12px;font-size:16px;touch-action:manipulation}.trip-dialog select[aria-label="일정 분류"]:focus-visible{outline:2px solid #2459ef;outline-offset:2px}.number-cell{font-variant-numeric:tabular-nums}.cover-hint{color:#77869c;font-size:12px;line-height:1.5}.cover-photo{transition:opacity .25s ease}</style><link rel="stylesheet" href="./assets/travel-ai.css">

<section class="travel-ai-section" aria-labelledby="travel-ai-title">
  <div class="travel-ai-shell">
    <header class="travel-ai-heading">
      <div><span class="travel-ai-eyebrow">YOUR TRAVEL COMPANION</span><h2 id="travel-ai-title">다음 여행, 함께 고민해요.</h2><p>여행 목표부터 맛집 한 곳까지, 궁금한 것을 물어보세요.</p></div>
      <span class="travel-ai-symbol" aria-hidden="true">AI</span>
    </header>
    <div class="travel-ai-body">
      <div class="travel-ai-examples" aria-label="질문 예시">
        <button type="button" data-ai-question="오사카 3박 4일 일정이 고민되는데, 맛집 투어 위주로 계획을 짜줘.">오사카 3박 4일, 맛집 중심으로</button>
        <button type="button" data-ai-question="도쿄 셋째 날 근교로 가고 싶은데 어디가 좋을까? 이동 부담도 비교해 줘.">도쿄 셋째 날, 근교 어디로?</button>
        <button type="button" data-ai-question="도쿄에서 츠케멘의 정수를 느낄 수 있는 곳을 추천해 줘. 가게별 특징과 대표 메뉴도 알려줘.">도쿄에서 제대로 즐기는 츠케멘</button>
      </div>
      <form id="travel-ai-form" class="travel-ai-form">
        <label for="travel-ai-question">어떤 여행을 하고 싶나요?</label>
        <textarea id="travel-ai-question" name="question" maxlength="2000" required placeholder="예: 오사카 3박 4일, 식사는 하루 2곳 정도로 여유 있게 맛집 중심 일정을 짜줘."></textarea>
        <div class="travel-ai-options">
          <label class="travel-ai-check"><input id="travel-ai-include-trip" type="checkbox" checked>저장한 여행 참고</label>
          <label class="travel-ai-check"><input id="travel-ai-search" type="checkbox" checked>웹 검색으로 확인</label>
        </div>
        <div class="travel-ai-trip-row"><select id="travel-ai-trip" aria-label="AI가 참고할 저장된 여행"></select><button id="travel-ai-refresh" type="button">목록 새로고침</button></div>
        <p id="travel-ai-trip-note" class="travel-ai-trip-note"></p>
        <div class="travel-ai-form-footer">
          <small>질문과 선택한 여행 정보가 Gemini로 전송돼요.<br>운영 시간·예약·가격은 방문 전에 다시 확인해 주세요.</small>
          <div class="travel-ai-buttons"><button id="travel-ai-cancel" type="button" hidden>중단</button><button id="travel-ai-submit" type="submit">AI에게 물어보기</button></div>
        </div>
      </form>
      <div id="travel-ai-notice" class="travel-ai-notice" role="status" aria-live="polite"></div>
      <div id="travel-ai-log" class="travel-ai-log" role="region" aria-label="AI 여행 상담 답변"></div>
    </div>
  </div>
  <div class="travel-ai-bottom"><span>Gemini 3.5 Flash-Lite · 대화는 현재 화면에서만 유지돼요.</span><button id="travel-ai-reset" class="travel-ai-reset" type="button">대화 지우기</button></div>
</section>
